title: MASVS-CRYPTO Cryptography
text: Cryptography is essential for mobile apps because mobile devices are highly
  portable and can be easily lost or stolen. This means that an attacker who gains
  physical access to a device can potentially access all the sensitive data stored
  on it, including passwords, financial information, and personally identifiable information.
  Cryptography provides a means of protecting this sensitive data by encrypting it
  so that it cannot be easily read or accessed by an unauthorized user. The purpose
  of the controls in this category is to ensure that the verified app uses cryptography
  according to industry best practices, which are typically defined in external standards
  such as NIST.SP.800-175B and NIST.SP.800-57. This category also focuses on the management
  of cryptographic keys throughout their lifecycle, including key generation, storage,
  and protection. Poor key management can compromise even the strongest cryptography,
  so it is crucial for developers to follow the recommended best practices to ensure
  the security of their users' sensitive data.
