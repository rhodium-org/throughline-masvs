uid: SR-0005
type: system_requirement
status: approved
title: Uses secure authentication and authorization protocols and follows the relevant
  best practices
text: The app uses secure authentication and authorization protocols and follows the
  relevant best practices.
rationale: Most apps connecting to a remote endpoint require user authentication and
  also enforce some kind of authorization. While the enforcement of these mechanisms
  must be on the remote endpoint, the apps also have to ensure that it follows all
  the relevant best practices to ensure a secure use of the involved protocols.
