uid: SR-0013
type: system_requirement
status: approved
title: Requires an up-to-date platform version
text: The app requires an up-to-date platform version.
rationale: Every release of the mobile OS includes security patches and new security
  features. By supporting older versions, apps stay vulnerable to well-known threats.
  This control ensures that the app is running on an up-to-date platform version so
  that users have the latest security protections.
links:
- target: UR-0006
  type: implements
