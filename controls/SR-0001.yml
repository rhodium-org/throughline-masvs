uid: SR-0001
type: system_requirement
status: approved
title: Securely stores sensitive data
text: The app securely stores sensitive data.
rationale: Apps handle sensitive data coming from many sources such as the user, the
  backend, system services or other apps on the device and usually need to store it
  locally. The storage locations may be private to the app (e.g. its internal storage)
  or be public and therefore accessible by the user or other installed apps (e.g.
  public folders such as Downloads). This control ensures that any sensitive data
  that is intentionally stored by the app is properly protected independently of the
  target location.
