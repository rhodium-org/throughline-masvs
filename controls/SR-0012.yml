uid: SR-0012
type: system_requirement
status: approved
title: Uses the user interface securely
text: The app uses the user interface securely.
rationale: Sensitive data has to be displayed in the UI in many situations (e.g. passwords,
  credit card details, OTP codes in notifications). This control ensures that this
  data doesn't end up being unintentionally leaked due to platform mechanisms such
  as auto-generated screenshots or accidentally disclosed via e.g. shoulder surfing
  or sharing the device with another person.
links:
- target: UR-0005
  type: implements
