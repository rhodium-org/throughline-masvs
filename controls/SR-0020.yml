uid: SR-0020
type: system_requirement
status: approved
title: Implements anti-dynamic analysis techniques
text: The app implements anti-dynamic analysis techniques.
rationale: Sometimes pure static analysis is very difficult and time consuming so
  it typically goes hand in hand with dynamic analysis. Observing and manipulating
  an app during runtime makes it much easier to decipher its behavior. This control
  aims to make it as difficult as possible to perform dynamic analysis, as well as
  prevent dynamic instrumentation which could allow an attacker to modify the code
  at runtime.
