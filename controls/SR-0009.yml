uid: SR-0009
type: system_requirement
status: approved
title: Performs identity pinning for all remote endpoints under the developer's control
text: The app performs identity pinning for all remote endpoints under the developer's
  control.
rationale: Instead of trusting all the default root CAs of the framework or device,
  this control will make sure that only very specific CAs are trusted. This practice
  is typically called certificate pinning or public key pinning.
