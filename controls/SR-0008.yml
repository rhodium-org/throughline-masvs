uid: SR-0008
type: system_requirement
status: approved
title: Secures all network traffic according to the current best practices
text: The app secures all network traffic according to the current best practices.
rationale: Ensuring data privacy and integrity of any data in transit is critical
  for any app that communicates over the network. This is typically done by encrypting
  data and authenticating the remote endpoint, as TLS does. However, there are many
  ways for a developer to disable the platform secure defaults, or bypass them completely
  by using low-level APIs or third-party libraries. This control ensures that the
  app is in fact setting up secure connections in any situation.
