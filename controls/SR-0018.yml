uid: SR-0018
type: system_requirement
status: approved
title: Implements anti-tampering mechanisms
text: The app implements anti-tampering mechanisms.
rationale: Apps run on a user-controlled device, and without proper protections it's
  relatively easy to run a modified version locally (e.g. to cheat in a game, or enable
  premium features without paying), or upload a backdoored version of it to third-party
  app stores. This control tries to ensure the integrity of the app's intended functionality
  by preventing modifications to the original code and resources.
links:
- target: UR-0007
  type: implements
attrs:
  source_ref: MASVS-RESILIENCE-2
