uid: SR-0019
type: system_requirement
status: approved
title: Implements anti-static analysis mechanisms
text: The app implements anti-static analysis mechanisms.
rationale: Understanding the internals of an app is typically the first step towards
  tampering with it (either dynamically, or statically). This control tries to impede
  comprehension by making it as difficult as possible to figure out how an app works
  using static analysis.
links:
