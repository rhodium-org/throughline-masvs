uid: SR-0002
type: system_requirement
status: approved
title: Prevents leakage of sensitive data
text: The app prevents leakage of sensitive data.
rationale: There are cases when sensitive data is unintentionally stored or exposed
  to publicly accessible locations; typically as a side-effect of using certain APIs,
  system capabilities such as backups or logs. This control covers this kind of unintentional
  leaks where the developer actually has a way to prevent it.
links:
